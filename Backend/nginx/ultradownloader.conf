# UltraDownloader reverse proxy.
#
# IMPORTANT (M28):
#  * Set PUBLIC_SITE_URL in Backend/.env to your REAL public HTTPS origin, e.g.
#      PUBLIC_SITE_URL=https://ultradownloader.pro
#    otherwise sitemap.xml / robots.txt will emit http://localhost:5173 URLs.
#  * Behind this proxy set TRUST_PROXY_HOPS=1 in Backend/.env so req.ip uses
#    the forwarded client address but a raw X-Forwarded-For cannot spoof it.
#  * Terminate TLS here. Uncomment the HTTPS server block below and redirect
#    port 80 once certificates are provisioned (e.g. certbot / Let's Encrypt).
#    HSTS must only be sent over HTTPS.

server {
    listen 80;
    server_name ultradownloader.pro www.ultradownloader.pro;
    client_max_body_size 25M;

    root /var/www/ultradownloader/frontend/dist;
    index index.html;

    # Baseline security headers (HSTS added only in the TLS server block).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Static build output is immutable and can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # CRITICAL: unbuffered real-time SSE for the admin live notification feed.
    location /api/v1/admin/live-cards/stream {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # Streaming HTTP 206 partial content / resumable downloads.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /sitemap.xml { proxy_pass http://127.0.0.1:4000/sitemap.xml; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:4000/robots.txt; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

